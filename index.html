<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Vitrine — Gerador de destaque</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Início"><span class="brand-mark">V</span><span>VITRINE<small>gerador de ofertas</small></span></a>
    <div class="top-actions">
      <div class="top-status"><span></span> Salvo neste dispositivo</div>
    </div>
  </header>

  <main class="dashboard-shell">
    <div class="dashboard-inner">
      <div class="eyebrow">PAINEL <span>00</span></div>
      <h1 class="dashboard-title">Gerador de<br><em>Destaque.</em></h1>
      <p class="intro">Escolha o tipo de destaque que deseja gerar.</p>
      <div class="dashboard-grid">
        <a id="optSmartphone" class="dash-card" href="smartphone.html">
          <span class="dash-num">01</span>
          <h2>Destaque<br>SmartPhone</h2>
          <p>Monte a arte com preços, condições de pagamento e ficha técnica.</p>
          <span class="dash-cta">Começar <i>→</i></span>
        </a>
        <button id="optOutros" class="dash-card disabled" type="button" aria-disabled="true">
          <span class="dash-num">02</span>
          <h2>Destaque Outros<br>Produtos</h2>
          <p>Novos modelos de destaque para outras categorias de produto.</p>
          <span class="dash-badge">Em desenvolvimento</span>
        </button>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    document.getElementById("optOutros").addEventListener("click", () => {
      const toast = document.getElementById("toast");
      toast.textContent = "Em desenvolvimento — em breve novidades por aqui!";
      toast.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    });
  </script>
</body>
</html>
